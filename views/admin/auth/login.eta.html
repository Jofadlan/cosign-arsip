<% layout("/layouts/admin") %>
<% it.title = "Sign in — CoSign" %>

<div class="max-w-md mx-auto mt-10">
  <h1 class="text-2xl font-bold mb-6 text-center">Sign in to CoSign</h1>
  <%~ include("/partials/errors", { errors: it.errors }) %>
  <form method="post" action="/admin/login" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
    <div>
      <label for="username" class="block text-sm font-medium mb-1">Username</label>
      <input id="username" name="username" required value="<%= it.old.username ?? '' %>"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Password</label>
      <input id="password" name="password" type="password" required
        class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>
    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700">Sign in</button>
  </form>
  <p class="text-center text-sm text-slate-500 mt-4">
    Don't have an account? <a href="/admin/register" class="text-indigo-600 hover:underline">Register</a>
  </p>
</div>
